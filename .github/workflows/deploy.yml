name: Deploy

# Publica pe GitHub Pages din master. Cronul re-scrapeaza datele zilnic; un push
# de cod refoloseste ultimul scrape din cache (deploy rapid, fara re-scrape).
on:
  push:
    branches: [master]
  schedule:
    - cron: "0 5 * * *" # zilnic ~08:00 RO (05:00 UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# un singur deploy odata; nu anulam unul in curs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: uv sync

      # datele scrapate (site/data) se pastreaza intre rulari, cheie unica pe
      # rulare + restore pe prefix -> restaureaza ultimul scrape disponibil
      - name: Restore date
        id: date
        uses: actions/cache/restore@v4
        with:
          # doar ce scrapeaza (localitati.json e versionat, vine din checkout)
          path: |
            site/data/parlamentari
            site/data/meta.json
            site/data/sigle
          key: date-${{ github.run_id }}
          restore-keys: date-

      # scrape doar la cron / manual / prima data (cache gol); push-ul de cod
      # refoloseste datele restaurate. Sursele (cdep/senat) blocheaza IP-urile
      # de datacenter ale runnerului -> scrapem printr-un tunel WireGuard (exit RO).
      - name: Install scrape deps
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.date.outputs.cache-matched-key == ''
        run: sudo apt-get update && sudo apt-get install -y wireguard-tools just

      - name: Scrape
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.date.outputs.cache-matched-key == ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WG_CONF: ${{ secrets.WG_CONF }}
        run: |
          set +e
          # --- tunel WireGuard, SPLIT: prin el merg doar sursele care blocheaza
          # runnerul. Restul (GitHub — inclusiv streamul de loguri al runnerului,
          # Gemini, DNS) ramane direct; cu 0.0.0.0/0 runnerul isi pierdea legatura
          # cu GitHub cat timp tunelul era sus. WG_CONF nu are voie sa aiba DNS:
          # wg-quick ar cere resolvconf (lipsa pe Ubuntu 24.04), si oricum folosim
          # DNS-ul runnerului.
          IPS=$(getent ahostsv4 www.cdep.ro www.senat.ro | awk '{print $1"/32"}' | sort -u | paste -sd,)
          [ -n "$IPS" ] || { echo "::error::nu pot rezolva cdep/senat"; exit 1; }
          echo "prin tunel: $IPS"
          if printf '%s' "$WG_CONF" | grep -q '^[[:space:]]*DNS'; then
            echo "::error::wg conf must not have DNS"
            exit 1
          fi
          sudo mkdir -p /etc/wireguard
          printf '%s' "$WG_CONF" | sed "s#^[[:space:]]*AllowedIPs.*#AllowedIPs = $IPS#" \
            | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0 || { echo "::error::tunel WireGuard esuat"; exit 1; }
          trap 'sudo wg-quick down wg0 || true' EXIT
          curl -sS --max-time 30 -o /dev/null -w "cdep prin tunel: HTTP %{http_code} in %{time_total}s\n" \
            "https://www.cdep.ro/" || { echo "::error::cdep inaccesibil prin tunel"; exit 1; }
          # --- scrape (cu retry pe 503) ---
          just scrape; code=$?
          n=0
          while [ "$code" -eq 2 ] && [ "$n" -lt 3 ]; do
            n=$((n + 1))
            echo "::warning::scrape incomplet (503?), retry $n dupa 2 min"
            sleep 120
            just scrape --continue; code=$?
          done
          # publicam doar la 0 (complet) sau 2 (partial, baseline mecanic valid);
          # orice altceva (1 = esec, 130 = intrerupt...) opreste job-ul
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "::error::scrape esuat (exit $code) — nu publicam"
            exit "$code"
          fi
          exit 0

      - name: Save date
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.date.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: |
            site/data/parlamentari
            site/data/meta.json
            site/data/sigle
          key: date-${{ github.run_id }}

      - name: Build
        run: |
          cd site
          npm ci
          npm run build
          echo demnitari.ro > dist/CNAME  # tine domeniul custom intre deploy-uri

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

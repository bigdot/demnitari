[project]
name = "demnitari-scrapers"
version = "0.1.0"
description = "Scrapers for Romanian parliament data"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "lxml",
    "beautifulsoup4",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrapers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
